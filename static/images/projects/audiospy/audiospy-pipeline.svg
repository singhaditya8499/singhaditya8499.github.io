<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 500" role="img" aria-labelledby="title description">
  <title id="title">AudioSpy detection pipeline</title>
  <desc id="description">Six steps show how AudioSpy emits tones, observes room reflections, samples the microphone, measures three carriers, compares them with a baseline, and logs a sustained change.</desc>
  <defs>
    <style>
      :root { --bg:#f8fafc; --panel:#ffffff; --ink:#172033; --muted:#5f6b7a; --line:#cbd5e1; --blue:#2563eb; --cyan:#0891b2; --purple:#7c3aed; --green:#15803d; }
      @media (prefers-color-scheme: dark) { :root { --bg:#111827; --panel:#1f2937; --ink:#f3f4f6; --muted:#cbd5e1; --line:#475569; --blue:#60a5fa; --cyan:#22d3ee; --purple:#c4b5fd; --green:#4ade80; } }
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill:var(--ink); }
      .title { font-size:25px; font-weight:700; }
      .step { font-size:19px; font-weight:700; }
      .detail { font-size:14px; fill:var(--muted); }
      .number { font-size:17px; font-weight:750; fill:#ffffff; text-anchor:middle; dominant-baseline:central; }
      .flow { fill:none; stroke:var(--line); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="var(--line)"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.11"/></filter>
  </defs>

  <rect width="720" height="500" rx="24" fill="var(--bg)"/>
  <text x="32" y="45" class="title">From reflected sound to one useful event</text>

  <path d="M226 157 H263" class="flow" marker-end="url(#arrow)"/>
  <path d="M457 157 H494" class="flow" marker-end="url(#arrow)"/>
  <path d="M590 218 V273" class="flow" marker-end="url(#arrow)"/>
  <path d="M494 351 H457" class="flow" marker-end="url(#arrow)"/>
  <path d="M263 351 H226" class="flow" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="32" y="95" width="194" height="123" rx="16" fill="var(--panel)" stroke="var(--cyan)" stroke-width="2"/>
    <circle cx="62" cy="125" r="18" fill="var(--cyan)"/><text x="62" y="125" class="number">1</text>
    <text x="52" y="168" class="step">Emit three tones</text>
    <text x="52" y="194" class="detail">18.75 to 19.75 kHz</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="263" y="95" width="194" height="123" rx="16" fill="var(--panel)" stroke="var(--blue)" stroke-width="2"/>
    <circle cx="293" cy="125" r="18" fill="var(--blue)"/><text x="293" y="125" class="number">2</text>
    <text x="283" y="168" class="step">Cross the room</text>
    <text x="283" y="194" class="detail">Objects reshape the tones</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="494" y="95" width="194" height="123" rx="16" fill="var(--panel)" stroke="var(--purple)" stroke-width="2"/>
    <circle cx="524" cy="125" r="18" fill="var(--purple)"/><text x="524" y="125" class="number">3</text>
    <text x="514" y="168" class="step">Sample the mic</text>
    <text x="514" y="194" class="detail">2,048 samples per block</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="494" y="289" width="194" height="123" rx="16" fill="var(--panel)" stroke="var(--purple)" stroke-width="2"/>
    <circle cx="524" cy="319" r="18" fill="var(--purple)"/><text x="524" y="319" class="number">4</text>
    <text x="514" y="362" class="step">Measure carriers</text>
    <text x="514" y="388" class="detail">Keep three tone strengths</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="263" y="289" width="194" height="123" rx="16" fill="var(--panel)" stroke="var(--blue)" stroke-width="2"/>
    <circle cx="293" cy="319" r="18" fill="var(--blue)"/><text x="293" y="319" class="number">5</text>
    <text x="283" y="362" class="step">Score the change</text>
    <text x="283" y="388" class="detail">Against empty baseline</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="32" y="289" width="194" height="123" rx="16" fill="var(--panel)" stroke="var(--green)" stroke-width="2"/>
    <circle cx="62" cy="319" r="18" fill="var(--green)"/><text x="62" y="319" class="number">6</text>
    <text x="52" y="362" class="step">Confirm and log</text>
    <text x="52" y="388" class="detail">Wait for four high blocks</text>
  </g>

  <text x="360" y="462" text-anchor="middle" class="detail">Raw microphone samples are discarded after the three measurements are calculated.</text>
</svg>
